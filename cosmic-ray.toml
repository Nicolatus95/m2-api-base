# Mutation testing con Cosmic Ray: solo el paquete tasks/.
# Ejecutar con el entorno virtual activo (su carpeta Scripts debe estar en el PATH).
# El test-command usa `pytest` y no `python -m pytest`: en Windows, CreateProcess
# busca `python` primero junto al proceso padre real (el Python base, sin las
# dependencias) y no en el PATH; `pytest.exe` sí se resuelve por el PATH.
#   cosmic-ray baseline cosmic-ray.toml
#   cosmic-ray init cosmic-ray.toml cosmic-ray.sqlite
#   cr-filter-operators cosmic-ray.sqlite cosmic-ray.toml
#   cosmic-ray exec cosmic-ray.toml cosmic-ray.sqlite
#   cr-report cosmic-ray.sqlite --show-pending
# Las mutaciones se aplican sobre los archivos en disco: confirmar (commit) antes.
[cosmic-ray]
module-path = "tasks"
timeout = 30.0
excluded-modules = []
test-command = "pytest -x -q --tb=no -p no:cacheprovider"

[cosmic-ray.distributor]
name = "local"

# Filtro de operadores (se aplica después de `init`, con cr-filter-operators).
# Excluye los mutantes que cambian el operador `|` por otro (+, &, ^, /, //, <<, %,
# *, **, >>, -). En tasks/ todos los `|` son anotaciones de tipo (`X | None`).
# En Python 3.14 las anotaciones de función no se evalúan al definirla, así que casi
# todos esos mutantes no cambian el comportamiento (equivalentes) y solo inflan el
# resultado.
# Excepción conocida: las anotaciones de los parámetros de routes.py (líneas 17 y 29)
# sí las evalúa FastAPI al construir la ruta, y en la primera corrida esos mutantes
# (22) morían. El filtro actúa por nombre de operador, no por archivo, y también los
# oculta. Se acepta porque son pocos, porque cambiar esas anotaciones rompe de todos
# modos los tests de rutas (422/200 de `assignee_id` y `Idempotency-Key`) y porque
# separarlos exigiría filtros por línea que se desfasan con cada edición. Para
# revisarlos, ejecutar una sesión sin el filtro (omitir cr-filter-operators).
# Si se revisa este filtro, comprobar antes que `|` siga siendo solo de anotaciones.
[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]
